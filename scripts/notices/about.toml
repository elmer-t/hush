# cargo-about settings for THIRD_PARTY_NOTICES.md (run through `npm run notices`).
# Every platform Hush builds for: the notices cover the union.
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin"]
# Build scripts and tests don't ship.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Hush itself.
private = { ignore = true }
# Where a crate offers a choice, the first of these it offers is used. The generator
# flags the copyleft ones that end up chosen.
accepted = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "BSL-1.0", "0BSD", "Unlicense", "MIT-0",
  "OpenSSL", "CDLA-Permissive-2.0", "MPL-2.0", "LGPL-2.1", "LGPL-3.0", "GPL-2.0", "GPL-3.0", "AGPL-3.0", "EPL-2.0",
]
# ring's licence files aren't machine-readable; cargo-about knows how to read them.
workarounds = ["ring", "rustls", "chrono", "wasmtime", "tonic", "prost", "bitvec", "cocoa", "gtk", "windows", "sentry"]
