[package]
name = "hush"
version = "0.3.0"
description = "Private notes in an encrypted vault"
authors = ["Elmer Torensma"]
license = "MIT"
publish = false
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hush_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLCipher with OpenSSL compiled from source and linked statically (needs Perl at build time).
rusqlite = { version = "0.42", features = ["bundled-sqlcipher-vendored-openssl"] }
zeroize = "1"
thiserror = "2"
regex = "1"
yaml-rust2 = "0.13"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tauri-plugin-dialog = "2"
# Window size, position and maximized state across restarts (plain JSON, geometry only).
tauri-plugin-window-state = "2"
htmd = "0.5.6"
# Local embedding model (see docs/decisions.md, AI classification). ONNX Runtime is
# fetched at build time (`download-binaries`); nothing here can reach the network at runtime.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls", "copy-dylibs", "api-24", "half"] }
# The fp16 model hands back float16 tensors.
half = { version = "2.1", default-features = false }
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
sha2 = "0.10"
# The only HTTP client: downloads an optional model when the user clicks Download, to the
# descriptor's pinned URL (see docs/decisions.md, Optional models). Nothing else uses it.
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier", "win-system-proxy"] }

# GPU embedding on Windows through DirectML (#105). `download-binaries` then fetches ONNX
# Runtime's DirectML build, and `copy-dylibs` puts DirectML.dll next to the executable;
# the installer ships it from there (tauri.windows.conf.json). DXGI names the GPU.
[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["directml"] }
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Storage_FileSystem"] }

# Free disk space on the vault's drive before compacting (#149); Windows uses the
# `windows` crate above.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
